        format: YYYY-MM-DD
      - name: time
        label: 시간 (선택)
        widget: string
        required: false
        hint: '예: 18:00 또는 18:00~21:00. 하루 종일이면 비워두세요.'
      - name: end_date
        label: 끝나는 날짜 (여러 날이면)
        widget: datetime
        required: false
        type: date
        format: YYYY-MM-DD
      - name: location
        label: 장소
        widget: string
        required: false
        hint: '예: 제1공학관 과방 앞'
      - name: target
        label: 대상
        widget: string
        required: false
        hint: '예: 산업공학과 재학생 누구나'
      - name: kind
        label: 종류
        widget: select
        default: 학생회 행사
        options:
          - 학생회 행사
