          - 학사 일정
          - 복지
          - 진로
          - 기타
      - name: summary
        label: 한 줄 요약
        widget: text
        required: false
        hint: AI 비서가 가장 먼저 읽는 문장이에요. 핵심(누가·언제·어디서·무엇을)을 한두 문장으로 적어주세요.
      - name: apply_link
        label: 신청 링크
        widget: string
        required: false
      - name: refs
        label: 관련 링크
        widget: list
        required: false
        hint: 더 자세한 정보가 있는 다른 사이트(학과 홈페이지, 포털 공지, 신청 폼 등). AI 비서가 이 링크로 넘어가서 추가로 확인해요.
        fields:
          - name: name
            label: 링크 이름
            widget: string
            hint: '예: 학과 홈페이지 졸업요건 안내'
          - name: url
            label: 주소
            widget: string
            hint: https:// 로 시작하는 주소
          - name: description
            label: 여기서 확인할 수 있는 것 (선택)
            widget: string
            required: false
        summary: '{{name}}'
      - name: published
        label: 공개
        widget: boolean
        hint: 끄면 사이트와 AI에게 보이지 않아요(임시 저장용).
        default: true
      - name: body
        label: 상세 안내
        widget: markdown
        required: false
