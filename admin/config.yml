# 자동 생성 파일입니다. 직접 고치지 말고 schema.mjs를 고친 뒤 `npm run gen-config`를 실행하세요.
backend:
  name: github
  repo: echoalpa/hyu-ie-info
  branch: main
  auth_methods:
    - token
  commit_messages:
    create: '{{collection}} 추가: {{slug}}'
    update: '{{collection}} 수정: {{slug}}'
    delete: '{{collection}} 삭제: {{slug}}'
    uploadMedia: '파일 업로드: {{path}}'
    deleteMedia: '파일 삭제: {{path}}'
site_url: https://echoalpa.github.io/hyu-ie-info
display_url: https://echoalpa.github.io/hyu-ie-info
logo:
  src: ../img/icon-512.png
media_folder: static/uploads
public_folder: /uploads
collections:
  - name: notices
    label: 공지사항
    label_singular: 공지
    description: 학생회·학과 공지. 마감일이 있으면 꼭 넣어주세요.
    icon: campaign
    folder: content/notices
    create: true
    extension: md
    format: frontmatter
    slug: '{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}'
    preview_path: notices/{{slug}}.md
    summary: '{{title}}'
    editor:
      preview: false
    table_columns:
      - title
      - date
      - category
      - pinned
    sortable_fields:
      - title
      - date
    view_filters:
      - label: 공개 중
        field: published
        pattern: true
      - label: 비공개(임시·예시)
        field: published
        pattern: false
    fields:
      - name: title
        label: 제목
        widget: string
      - name: date
        label: 게시일
        widget: datetime
        default: '{{now}}'
        type: date
        format: YYYY-MM-DD
      - name: category
        label: 분류
        widget: select
        default: 기타
        options:
          - 학사
          - 졸업
          - 수강
          - 장학
          - 진로
          - 행사
          - 복지
          - 시설
          - 학생회
          - 기타
      - name: summary
        label: 한 줄 요약
        widget: text
        required: false
        hint: AI 비서가 가장 먼저 읽는 문장이에요. 핵심(누가·언제·어디서·무엇을)을 한두 문장으로 적어주세요.
      - name: deadline
        label: 마감일 (있으면)
        widget: datetime
        required: false
        type: date
        format: YYYY-MM-DD
      - name: link
        label: 원문·신청 링크
        widget: string
        required: false
        hint: https:// 로 시작하는 주소
      - name: pinned
        label: 상단 고정
        widget: boolean
        default: false
      - name: refs
        label: 관련 링크
        widget: list
        required: false
        hint: 더 자세한 정보가 있는 다른 사이트(학과 홈페이지, 포털 공지, 신청 폼 등). AI 비서가 이 링크로 넘어가서 추가로 확인해요.
        fields:
          - name: name
            label: 링크 이름
            widget: string
            hint: '예: 학과 홈페이지 졸업요건 안내'
          - name: url
            label: 주소
            widget: string
            hint: https:// 로 시작하는 주소
          - name: description
            label: 여기서 확인할 수 있는 것 (선택)
            widget: string
            required: false
        summary: '{{name}}'
      - name: published
        label: 공개
        widget: boolean
        hint: 끄면 사이트와 AI에게 보이지 않아요(임시 저장용).
        default: true
      - name: body
        label: 본문
        widget: markdown
        required: false
  - name: events
    label: 행사·일정
    label_singular: 행사
    description: 학생회·학과 자체 행사(개강총회, MT, 간식행사 등). 학교 공식 학사일정은 매일 자동으로 들어오니 넣지 않아도 돼요.
