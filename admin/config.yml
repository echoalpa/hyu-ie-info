# 자동 생성 파일입니다. 직접 고치지 말고 schema.mjs를 고친 뒤 `npm run gen-config`를 실행하세요.
backend:
  name: github
  repo: echoalpa/hyu-ie-info
  branch: main
  auth_methods:
    - token
  commit_messages:
    create: '{{collection}} 추가: {{slug}}'
    update: '{{collection}} 수정: {{slug}}'
    delete: '{{collection}} 삭제: {{slug}}'
    uploadMedia: '파일 업로드: {{path}}'
    deleteMedia: '파일 삭제: {{path}}'
site_url: https://echoalpa.github.io/hyu-ie-info
display_url: https://echoalpa.github.io/hyu-ie-info
logo:
  src: ../img/icon-512.png
media_folder: static/uploads
public_folder: /uploads
collections:
  - name: notices
    label: 공지사항
    label_singular: 공지
    description: '모든 공지는 같은 양식: 대상 → 해야 할 행동 → 정확한 마감 → 제출 경로 → 이미 처리한 사람 예외 → 출처와 작성일.'
    icon: campaign
    folder: content/notices
    create: true
    extension: md
    format: frontmatter
    slug: '{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}'
    preview_path: notices/{{slug}}.md
    summary: '{{title}}'
    editor:
      preview: false
    table_columns:
      - title
      - date
      - deadline
      - pinned
    sortable_fields:
      - title
      - date
    view_filters:
      - label: 공개 중
        field: published
        pattern: true
      - label: 비공개(임시·예시)
        field: published
        pattern: false
    fields:
      - name: title
        label: 제목
        widget: string
      - name: target
        label: 1. 대상
        widget: text
        required: false
        hint: '학년, 학번, 전공 등. 예: 산업공학과 3~4학년 중 2013학번 이후 입학자. 모르면 비워두세요. 비워둔 칸은 AI에게 [확인 필요]로 표시돼요.'
      - name: action
        label: 2. 해야 할 행동
        widget: text
        required: false
        hint: 학생이 무엇을 하면 되는지 동사로. 모르면 비워두세요. 비워둔 칸은 AI에게 [확인 필요]로 표시돼요.
      - name: deadline
        label: 3. 마감 날짜
        widget: datetime
        required: false
        hint: 요일은 자동으로 붙어요. 마감이 없으면 비우고 아래 "마감 메모"에 "해당 없음"이라고 적어주세요.
        type: date
        format: YYYY-MM-DD
      - name: deadline_time
        label: 3. 마감 시각
        widget: string
        required: false
        hint: '예: 18:00 또는 23:59'
      - name: deadline_note
        label: 3. 마감 메모 (기한 충돌 등)
        widget: text
        required: false
        hint: '출처끼리 기한이 다르면 하나를 고르지 말고 "기한 충돌: A는 ○○, B는 ○○, 확인 중"처럼 적어주세요.'
      - name: submit_via
        label: 4. 제출 경로
        widget: text
        required: false
        hint: LMS, 이메일, 종이 제출, HY-in 메뉴 등. 공식 안내에 적힌 그대로. 모르면 비워두세요. 비워둔 칸은 AI에게 [확인 필요]로 표시돼요.
      - name: exceptions
        label: 5. 이미 처리한 사람 예외
        widget: text
        required: false
        hint: '예: 이미 제출한 사람은 다시 내지 않아도 됨. 없으면 "해당 없음". 모르면 비워두세요. 비워둔 칸은 AI에게 [확인 필요]로 표시돼요.'
      - name: source
        label: 6. 출처 (공식 원문 링크)
        widget: string
        required: false
        hint: 학교·학과 공식 페이지 주소. 학생회가 직접 정한 내용이면 "학생회 직접 안내"라고 적어주세요. 모르면 비워두세요. 비워둔 칸은 AI에게 [확인 필요]로 표시돼요.
      - name: date
        label: 6. 작성일
        widget: datetime
        default: '{{now}}'
        type: date
        format: YYYY-MM-DD
      - name: checked
        label: 최종확인일
        widget: datetime
        required: false
        hint: 이 내용이 맞는지 마지막으로 확인한 날
        default: '{{now}}'
        type: date
        format: YYYY-MM-DD
      - name: category
        label: 분류
        widget: select
        default: 기타
        options:
          - 학사
          - 졸업
          - 수강
          - 장학
          - 진로
          - 행사
          - 복지
          - 시설
          - 학생회
          - 기타
      - name: summary
        label: 한 줄 요약
        widget: text
        required: false
        hint: AI 비서가 가장 먼저 읽는 문장이에요. 핵심(누가·언제·어디서·무엇을)을 한두 문장으로 적어주세요.
      - name: pinned
        label: 상단 고정
        widget: boolean
        default: false
      - name: refs
        label: 관련 링크
        widget: list
        required: false
        hint: 더 자세한 정보가 있는 다른 사이트(학과 홈페이지, 포털 공지, 신청 폼 등). AI 비서가 이 링크로 넘어가서 추가로 확인해요.
        fields:
          - name: name
            label: 링크 이름
            widget: string
            hint: '예: 학과 홈페이지 졸업요건 안내'
          - name: url
            label: 주소
            widget: string
            hint: https:// 로 시작하는 주소
          - name: description
            label: 여기서 확인할 수 있는 것 (선택)
            widget: string
            required: false
        summary: '{{name}}'
      - name: published
        label: 공개
        widget: boolean
        hint: 끄면 사이트와 AI에게 보이지 않아요(임시 저장용).
        default: true
      - name: body
        label: 추가 설명 (선택)
        widget: markdown
        required: false
  - name: events
    label: 행사·일정
    label_singular: 행사
