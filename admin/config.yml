    folder: content/events
    create: true
    extension: md
    format: frontmatter
    slug: '{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}'
    preview_path: events/{{slug}}.md
    summary: '{{title}}'
    editor:
