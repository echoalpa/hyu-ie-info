name: 사이트 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: '5 15 * * *'   # 매일 00:05 KST: 학사일정 동기화 + "예정/종료" 상태 갱신
  workflow_dispatch:

permissions:
  contents: write   # 학사일정 변경분을 저장소에 커밋
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 글별 "마지막 수정" 시각을 git 기록에서 읽음
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 한양대 학사일정 동기화
        run: node scripts/fetch-academic.mjs
      - name: 학사일정이 바뀌었으면 저장소에 기록
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain data/academic.yml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
            git add data/academic.yml
            git commit -m "학사일정 자동 동기화"
            git pull --rebase && git push
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
