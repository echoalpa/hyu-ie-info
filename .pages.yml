# 자동 생성 파일입니다. 직접 고치지 말고 schema.mjs를 고친 뒤 `npm run gen-config`를 실행하세요.
media:
  input: static/uploads
  output: /uploads
content:
  - name: notices
    label: 공지사항
    type: collection
    path: content/notices
    filename: '{year}{month}{day}-{hour}{minute}{second}.md'
    view:
      fields:
        - title
        - date
        - category
        - published
    fields:
      - name: title
        label: 제목
        type: string
        required: true
      - name: date
        label: 게시일
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: category
        label: 분류
        type: select
        required: true
        default: 기타
        options:
          values:
            - 학사
            - 졸업
            - 수강
            - 장학
            - 진로
            - 행사
            - 복지
            - 시설
            - 학생회
            - 기타
      - name: summary
        label: 한 줄 요약
        type: text
        description: AI 비서가 가장 먼저 읽는 문장이에요. 핵심(누가·언제·어디서·무엇을)을 한두 문장으로 적어주세요.
      - name: deadline
        label: 마감일 (있으면)
        type: date
        options:
          format: yyyy-MM-dd
      - name: link
        label: 원문·신청 링크
        type: string
        description: https:// 로 시작하는 주소
      - name: pinned
        label: 상단 고정
        type: boolean
        default: false
      - name: published
        label: 공개
        type: boolean
        description: 끄면 사이트와 AI에게 보이지 않아요(임시 저장용).
        default: true
      - name: body
        label: 본문
        type: rich-text
        options:
          format: markdown
  - name: events
    label: 행사·일정
    type: collection
    path: content/events
    filename: '{year}{month}{day}-{hour}{minute}{second}.md'
    view:
      fields:
        - title
        - start
        - kind
        - published
    fields:
      - name: title
        label: 행사명
        type: string
        required: true
      - name: start
        label: 시작
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm
      - name: end
        label: 종료 (선택)
        type: date
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm
      - name: location
        label: 장소
        type: string
        description: '예: 제1공학관 과방 앞'
      - name: target
        label: 대상
        type: string
        description: '예: 산업공학과 재학생 누구나'
      - name: kind
        label: 종류
        type: select
        required: true
        default: 학생회 행사
        options:
          values:
            - 학생회 행사
            - 학과 행사
            - 학사 일정
            - 복지
            - 진로
            - 기타
      - name: summary
        label: 한 줄 요약
        type: text
        description: AI 비서가 가장 먼저 읽는 문장이에요. 핵심(누가·언제·어디서·무엇을)을 한두 문장으로 적어주세요.
      - name: apply_link
        label: 신청 링크
        type: string
      - name: published
        label: 공개
        type: boolean
        description: 끄면 사이트와 AI에게 보이지 않아요(임시 저장용).
        default: true
      - name: body
        label: 상세 안내
        type: rich-text
        options:
          format: markdown
  - name: faq
    label: 자주 묻는 질문
    type: collection
    path: content/faq
    filename: '{year}{month}{day}-{hour}{minute}{second}.md'
    view:
      fields:
        - title
        - category
        - published
    fields:
      - name: title
        label: 질문
        type: string
        required: true
        description: '학생이 실제로 물어볼 말투로. 예: 졸업하려면 인턴을 꼭 해야 하나요?'
      - name: category
        label: 분류
        type: select
        required: true
        default: 기타
        options:
          values:
            - 학사
            - 졸업
            - 수강
            - 장학
            - 진로
            - 행사
            - 복지
            - 시설
            - 학생회
            - 기타
      - name: summary
        label: 짧은 답
        type: text
        required: true
        description: 한두 문장으로 결론부터.
      - name: source
        label: 근거 링크 (선택)
        type: string
        description: 학과 홈페이지, 학칙 등 확인할 수 있는 곳
      - name: updated
        label: 확인한 날짜
        type: date
        required: true
        description: 정보가 맞는지 마지막으로 확인한 날
        options:
          format: yyyy-MM-dd
      - name: published
        label: 공개
        type: boolean
        description: 끄면 사이트와 AI에게 보이지 않아요(임시 저장용).
        default: true
      - name: body
        label: 자세한 답
        type: rich-text
        options:
          format: markdown
  - name: guides
    label: 학과 생활 가이드
    type: collection
    path: content/guides
    filename: '{year}{month}{day}-{hour}{minute}{second}.md'
    view:
      fields:
        - title
        - category
        - published
    fields:
      - name: title
        label: 제목
        type: string
        required: true
      - name: category
        label: 분류
        type: select
        required: true
        default: 기타
        options:
          values:
            - 학사
            - 졸업
            - 수강
            - 장학
            - 진로
            - 행사
            - 복지
            - 시설
            - 학생회
            - 기타
      - name: summary
        label: 한 줄 요약
        type: text
        description: AI 비서가 가장 먼저 읽는 문장이에요. 핵심(누가·언제·어디서·무엇을)을 한두 문장으로 적어주세요.
      - name: updated
        label: 확인한 날짜
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: order
        label: 정렬 순서
        type: number
        description: 작은 숫자가 먼저 나와요
      - name: published
        label: 공개
        type: boolean
        description: 끄면 사이트와 AI에게 보이지 않아요(임시 저장용).
        default: true
      - name: body
        label: 본문
        type: rich-text
        options:
          format: markdown
  - name: career
    label: IE 커리어 아카이브
    type: collection
    path: content/career
    filename: '{year}{month}{day}-{hour}{minute}{second}.md'
    view:
      fields:
        - title
        - kind
        - published
    fields:
      - name: title
        label: 제목
        type: string
        required: true
        description: '예: SCM 직무 인턴 후기'
      - name: kind
        label: 종류
        type: select
        required: true
        default: 직무 소개
        options:
          values:
            - 직무 소개
            - 인턴 후기
            - 취업 후기
            - 대학원
            - 대외활동
            - 자격증·시험
            - 기타
      - name: field
        label: 분야·직무
        type: string
        description: '예: SCM, 데이터 분석, 컨설팅, 생산관리'
      - name: company
        label: 회사·기관 (선택)
        type: string
      - name: year
        label: 연도
        type: number
      - name: author
        label: 작성자 표기
        type: string
        description: 실명 대신 "19학번 선배"처럼 적어도 돼요
      - name: summary
        label: 한 줄 요약
        type: text
        description: AI 비서가 가장 먼저 읽는 문장이에요. 핵심(누가·언제·어디서·무엇을)을 한두 문장으로 적어주세요.
      - name: published
        label: 공개
        type: boolean
        description: 끄면 사이트와 AI에게 보이지 않아요(임시 저장용).
        default: true
      - name: body
        label: 본문
        type: rich-text
        options:
          format: markdown
  - name: mentors
    label: Home-coming 선배 멘토
    type: collection
    path: content/mentors
    filename: '{year}{month}{day}-{hour}{minute}{second}.md'
    view:
      fields:
        - title
        - published
    fields:
      - name: title
        label: 이름 또는 닉네임
        type: string
        required: true
      - name: cohort
        label: 학번
        type: string
        description: '예: 18학번'
      - name: field
        label: 분야·직무
        type: string
      - name: company
        label: 소속 (선택)
        type: string
      - name: topics
        label: 상담 가능 주제
        type: string
        description: '쉼표로 구분. 예: 취업, 대학원, 교환학생'
        list: true
      - name: contact
        label: 신청 방법
        type: text
        description: 개인 연락처 대신 학생회 신청 폼 등을 권장해요
      - name: available
        label: 현재 멘토링 가능
        type: boolean
        default: true
      - name: summary
        label: 한 줄 요약
        type: text
        description: AI 비서가 가장 먼저 읽는 문장이에요. 핵심(누가·언제·어디서·무엇을)을 한두 문장으로 적어주세요.
      - name: published
        label: 공개
        type: boolean
        description: 끄면 사이트와 AI에게 보이지 않아요(임시 저장용).
        default: true
      - name: body
        label: 소개
        type: rich-text
        options:
          format: markdown
  - name: site
    label: 학생회 기본 정보
    type: file
    path: data/site.yml
    format: yaml
    fields:
      - name: name
        label: 학생회 이름
        type: string
        required: true
      - name: term
        label: 임기
        type: string
        required: true
        description: '예: 2027학년도'
      - name: department
        label: 학과
        type: string
        required: true
      - name: intro
        label: 소개
        type: text
        required: true
      - name: officers
        label: 임원진
        type: object
        required: true
        list: true
        fields:
          - name: role
            label: 직책
            type: string
            required: true
          - name: name
            label: 이름
            type: string
            required: true
      - name: contacts
        label: 연락 창구
        type: object
        required: true
        list: true
        fields:
          - name: label
            label: 이름
            type: string
            required: true
            description: '예: 인스타그램, 익명 건의 카톡방'
          - name: url
            label: 주소
            type: string
            required: true
          - name: note
            label: 설명
            type: string
  - name: links
    label: 바로가기 사이트
    type: file
    path: data/links.yml
    format: yaml
    fields:
      - name: links
        label: 바로가기 목록
        type: object
        required: true
        list: true
        fields:
          - name: name
            label: 사이트 이름
            type: string
            required: true
          - name: url
            label: 주소
            type: string
            required: true
          - name: description
            label: 여기서 할 수 있는 일
            type: string
            required: true
            description: AI가 어떤 질문에 이 링크를 줄지 판단하는 데 써요
          - name: category
            label: 분류
            type: select
            required: true
            default: 기타
            options:
              values:
                - 학사
                - 졸업
                - 수강
                - 장학
                - 진로
                - 행사
                - 복지
                - 시설
                - 학생회
                - 기타
